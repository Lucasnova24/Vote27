name: Android release (AAB signé)

# Déclenchement manuel uniquement. Construit l'AAB de release signé à partir de secrets GitHub
# (Settings > Secrets and variables > Actions). Voir store/ANDROID.md.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (entier, strictement croissant à chaque envoi sur Play)"
        required: true
        type: string
      version_name:
        description: "versionName (ex. 1.0.0)"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SDK Android déjà présent sur les runners ubuntu-latest (ANDROID_HOME).

      - name: Installer les dépendances
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run cap:sync

      - name: Décoder le keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Construire l'AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PversionCode=${{ inputs.version_code }} -PversionName=${{ inputs.version_name }}

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: petitvote-${{ inputs.version_name }}-${{ inputs.version_code }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
