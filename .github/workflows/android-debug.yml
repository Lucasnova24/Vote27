name: Android debug (vérification de compilation)

# Compile l'APK de debug (sans secret) pour vérifier que le projet Android se construit.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'app.config.json'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # SDK Android déjà présent sur les runners ubuntu-latest (ANDROID_HOME).
      - run: npm ci
      - name: Build web + sync Capacitor
        env:
          # Valeurs factices : suffisent à compiler (le vrai build utilise les secrets).
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: dummy
        run: npm run cap:sync
      - name: Assembler l'APK de debug
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: petitvote-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
