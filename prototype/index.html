<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon petit vote prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700;1,800&display=swap" rel="stylesheet">
<style>
:root{
  --papier:#F5F0E6;--surface:#FFFFFF;--encre:#16192B;--encre-douce:#3A3E4E;--filet:#C9C1B0;
  --isoloir:#1E3470;--isoloir-fond:#1E3470;--sur-isoloir:#FFFFFF;--urne:#C8401F;--sur-couleur:#FFFFFF;
  --isoloir-pale:#D9DEEE;--succes:#2F7A5B;--or:#B8862E;--erreur-fond:#FBE9E4;--succes-fond:#E3F1EA;
  --ombre:8px 8px 0 #1E3470;--fond-mascotte:transparent;--pad-mascotte:0;
  --sans:"Plus Jakarta Sans","Helvetica Neue",Helvetica,Arial,sans-serif;
  --r-rep:10px;--r-carte:16px;--r-pastille:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papier:#121524;--surface:#1C2034;--encre:#F5F0E6;--encre-douce:#B9BCCB;--filet:#3A3F57;
  --isoloir:#8FA6E8;--sur-isoloir:#121524;--urne:#E8694A;--succes:#5DBB92;--or:#E0B25C;
  --erreur-fond:#3A2220;--succes-fond:#1D3329;--ombre:8px 8px 0 #8FA6E8;--fond-mascotte:#F5F0E6;--pad-mascotte:16px;color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#121524;--surface:#1C2034;--encre:#F5F0E6;--encre-douce:#B9BCCB;--filet:#3A3F57;
  --isoloir:#8FA6E8;--sur-isoloir:#121524;--urne:#E8694A;--succes:#5DBB92;--or:#E0B25C;
  --erreur-fond:#3A2220;--succes-fond:#1D3329;--ombre:8px 8px 0 #8FA6E8;--fond-mascotte:#F5F0E6;--pad-mascotte:16px;color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--papier);color:var(--encre);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
input{font:inherit;color:inherit}
a{color:var(--isoloir)}
:focus-visible{outline:3px solid var(--urne);outline-offset:3px;border-radius:4px}
h1,h2,h3,p{margin:0}
.etiquette{font:700 13px/1.2 var(--sans);letter-spacing:1.6px;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px}
.stk{display:flex;flex-direction:column}
.muted{color:var(--encre-douce)}

/* Pastilles */
.pastille{display:inline-block;font:700 14px/1.2 var(--sans);letter-spacing:.5px;padding:4px 10px;border-radius:var(--r-pastille);background:var(--urne);color:var(--sur-couleur);white-space:nowrap}
.pastille.theme{background:transparent;color:var(--encre);border:1.5px solid var(--filet);font-weight:600;font-size:13px}
.pastille.succes{background:var(--succes);color:#fff}
.pastille.or{background:var(--or);color:#16192B}
.pastille.bleu{background:var(--isoloir);color:var(--sur-isoloir)}
html[data-theme="dark"] .pastille.succes{color:#121524}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pastille.succes{color:#121524}}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 16px/1 var(--sans);padding:14px 22px;border-radius:var(--r-rep);border:2px solid var(--isoloir);cursor:pointer;text-decoration:none;min-height:48px}
.btn-p{background:var(--isoloir);color:var(--sur-isoloir)}
.btn-s{background:transparent;color:var(--isoloir)}
.btn-t{border-color:transparent;background:transparent;color:var(--encre);text-decoration:underline;text-underline-offset:4px;padding-inline:4px}
.btn-sm{padding:10px 16px;font-size:15px;min-height:44px}
.btn-b{width:100%}
.btn.inv{background:var(--sur-couleur);color:#1E3470;border-color:var(--sur-couleur)}

/* Shell */
#app{display:flex;height:100dvh;overflow:hidden}
.side{flex:none;width:248px;background:var(--isoloir-fond);color:var(--sur-couleur);padding:26px 16px 20px;display:flex;flex-direction:column;gap:4px}
.side .logo{padding:0 8px 26px}
.logo{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.logo b{font:800 22px/1 var(--sans);letter-spacing:-.7px;white-space:nowrap}
.navb{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:var(--r-rep);font-weight:600;font-size:15.5px;color:var(--isoloir-pale);border:2px solid transparent;min-height:46px}
.navb:hover{background:rgba(255,255,255,.08)}
.navb[aria-current="page"]{background:#F5F0E6;color:#1E3470;font-weight:700}
.navb svg{flex:none}
.side .flex{flex:1}
.moi{border-top:1px solid rgba(217,222,238,.35);padding-top:16px;margin-top:8px}
.moi .nom{font-weight:700;font-size:15px}
.moi .niv{font-size:13px;color:var(--isoloir-pale)}
.xpbar{height:6px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:12px}
.xpbar i{display:block;height:100%;background:var(--sur-couleur);border-radius:99px}
.disc{flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;letter-spacing:.03em}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 40px;border-bottom:2px solid var(--encre)}
.top .gauche{display:flex;align-items:center;gap:12px}
.top .droite{display:flex;align-items:center;gap:8px}
.chip-pts{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid var(--filet);border-radius:999px;background:var(--surface);font-weight:800;font-size:16px}
.chip-pts small{font-weight:600;font-size:13px;color:var(--encre-douce)}
.icbtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--filet);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--encre)}
.avatar{width:44px;height:44px;background:var(--isoloir-fond);color:#fff;font-size:14px}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.page{width:100%;margin:0 auto;max-width:1120px;padding:48px 40px 96px}
.page.flow{max-width:720px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;font-size:15px;color:var(--isoloir);margin:-8px 0 12px -4px;padding-right:12px}

.bnav{display:none}

/* En-têtes de page */
.entete{display:flex;flex-direction:column;gap:12px;margin-bottom:40px;max-width:760px}
.entete .etiquette{color:var(--isoloir)}
.entete h1{font-weight:800;font-size:clamp(38px,5.4vw,64px);line-height:1;letter-spacing:-.035em;text-wrap:balance}
.entete h1 em{font-style:italic;color:var(--urne)}
.entete .chapo{font-size:clamp(17px,1.6vw,21px);line-height:1.5;font-weight:500;max-width:46ch;color:var(--encre)}

.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:start}
.col{display:flex;flex-direction:column;gap:40px;min-width:0}
.bloc-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--encre);padding-top:14px;margin-bottom:6px}
.bloc-t h2{font-weight:800;font-size:24px;letter-spacing:-.02em}
.bloc-t span{font-size:14px;color:var(--encre-douce);font-weight:600}

/* Carte vedette */
.vedette{background:var(--surface);border:2px solid var(--encre);border-radius:var(--r-carte);padding:24px 26px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:16px;min-width:0}
.carte{background:var(--surface);border:2px solid var(--encre);border-radius:var(--r-carte);padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.carte.douce{border:1.5px solid var(--filet)}
.vedette h3,.carte h3{font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.3px;text-wrap:balance}
.tete{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tete .etiquette{color:var(--isoloir)}

/* Liste à faire (fonctionnalités numérotées) */
.todo{display:flex;flex-direction:column}
.todo-i{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;padding:18px 0;border-top:1.5px solid var(--filet);min-height:84px}
.todo-i:first-child{border-top:0}
.todo-i:hover .titre{text-decoration:underline;text-underline-offset:4px}
.todo-i .n{font-weight:800;font-size:30px;line-height:1;letter-spacing:-.5px;color:var(--urne)}
.todo-i.fait .n{color:var(--encre-douce);opacity:.55}
.todo-i .titre{font-weight:700;font-size:18px;line-height:1.3}
.todo-i .sub{font-size:15px;color:var(--encre-douce);margin-top:2px}
.todo-i.fait .titre{font-weight:600;color:var(--encre-douce)}
.prog{display:flex;gap:6px;margin:14px 0 4px}
.prog span{flex:1;height:6px;border-radius:999px;background:var(--filet)}
.prog span.ok{background:var(--succes)}
.prog span.ko{background:var(--urne)}
.prog span.ici{background:var(--isoloir)}

/* Lignes de liste */
.li{display:flex;align-items:center;gap:14px;width:100%;padding:14px 0;border-top:1.5px solid var(--filet);min-height:60px}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;font-weight:600;font-size:16px;line-height:1.3}
.li .s{font-size:14px;color:var(--encre-douce);font-weight:400;margin-top:2px;display:block}
.li.cliq:hover .t{text-decoration:underline;text-underline-offset:4px}
.cands{max-height:380px;overflow-y:auto;border-top:1.5px solid var(--filet)}
.cands .li{padding:11px 0}
.cands .li:first-child{border-top:0}
.cdisc{width:40px;height:40px;background:var(--isoloir-pale);color:#1E3470;font-size:13px}

/* Bandeau */
.bandeau{background:var(--isoloir-fond);color:var(--sur-couleur);padding:26px 28px;border-radius:var(--r-carte);display:flex;flex-direction:column;gap:8px}
.bandeau .etiquette{color:var(--isoloir-pale)}
.bandeau h3{font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.6px;text-wrap:balance}
.bandeau p{color:var(--isoloir-pale);font-size:15.5px;line-height:1.5}
.bandeau .btn{align-self:flex-start;margin-top:10px}
.pile{display:flex;padding-left:8px;margin:6px 0 4px}
.pile .disc{width:34px;height:34px;margin-left:-8px;border:2.5px solid var(--isoloir-fond);background:var(--isoloir-pale);color:#1E3470;font-size:11px}

/* Réponses */
.reponses{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.reponses.col1{grid-template-columns:1fr}
.reponse{font:500 17px/1.25 var(--sans);text-align:left;color:var(--encre);background:transparent;border:1.5px solid var(--filet);border-radius:var(--r-rep);padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:54px}
.reponse:hover:not(:disabled){border-color:var(--isoloir)}
.reponse .l{display:inline-flex;align-items:center;gap:12px}
.reponse .k{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--filet);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.reponse.juste{background:var(--isoloir);border:2px solid var(--isoloir);color:var(--sur-isoloir);font-weight:700}
.reponse.juste .k{border-color:currentColor}
.reponse.faux{border:2px solid var(--urne);background:var(--erreur-fond)}
.reponse.choisie{background:var(--isoloir);border:2px solid var(--isoloir);color:var(--sur-isoloir);font-weight:700}
.reponse.estompe{opacity:.6}
.explication{font-size:15px;line-height:1.5;color:var(--encre);padding:14px 16px;border-radius:var(--r-rep);background:var(--succes-fond)}
.explication.ko{background:var(--erreur-fond)}
.pied-q{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.score{font-weight:700;font-size:15px}
.score b{color:var(--urne);font-size:24px;font-weight:800}

/* Agenda */
.filtres{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:28px}
.filtre{font:600 14px/1 var(--sans);padding:11px 16px;border-radius:999px;border:1.5px solid var(--filet);color:var(--encre);white-space:nowrap;min-height:44px}
.filtre[aria-pressed="true"]{background:var(--isoloir);border-color:var(--isoloir);color:var(--sur-isoloir);font-weight:700}
.jour{margin-bottom:34px}
.jour .etiquette{display:block;color:var(--encre-douce);border-top:2px solid var(--encre);padding-top:12px;margin-bottom:6px}
.evt{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:16px;align-items:start;padding:16px 0;border-top:1.5px solid var(--filet)}
.jour .evt:first-of-type{border-top:0}
.quand{width:72px;border:2px solid var(--encre);border-radius:12px;padding:8px 0 7px;text-align:center;background:var(--surface)}
.quand b{display:block;font-weight:800;font-size:22px;line-height:1;letter-spacing:-.5px}
.quand small{display:block;font-size:12px;font-weight:600;color:var(--encre-douce);margin-top:3px}
.evt h3{font-weight:700;font-size:18px;line-height:1.3;letter-spacing:-.2px}
.evt .meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
.evt .meta .qui{font-size:14px;color:var(--encre-douce)}
.evt .desc{font-size:15px;color:var(--encre-douce);margin-top:8px;line-height:1.45}
.evt .src{font-size:13px;color:var(--encre-douce);margin-top:8px}
.cloche{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--filet);color:var(--encre)}
.cloche[aria-pressed="true"]{background:var(--isoloir);border-color:var(--isoloir);color:var(--sur-isoloir)}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--urne);flex:none}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 1.6s ease-in-out infinite}.reponse,.btn,.filtre{transition:background .15s,border-color .15s}.rise{animation:rise .35s ease both}}
@keyframes pulse{50%{opacity:.35}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.stat{border-top:2px solid var(--encre);padding-top:14px}
.stat b{display:block;font-weight:800;font-size:40px;line-height:1;letter-spacing:-1px}
.stat span{display:block;font-size:14px;color:var(--encre-douce);margin-top:8px;font-weight:500}
.rang{display:grid;grid-template-columns:36px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1.5px solid var(--filet)}
.rang:first-child{border-top:0}
.rang .p{font-weight:800;font-size:20px;letter-spacing:-.4px;color:var(--encre-douce)}
.rang.moi-l{background:var(--isoloir-pale);color:#16192B;margin:0 -12px;padding-inline:12px;border-radius:var(--r-rep);border-top-color:transparent}
.rang.moi-l .p{color:#1E3470}
.rang b{font-weight:700}

/* Profil */
.niveau{background:var(--isoloir-fond);color:#fff;border-radius:var(--r-carte);padding:26px 28px}
.niveau .big{font-weight:800;font-size:72px;line-height:.9;letter-spacing:-2px}
.niveau .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden;margin:18px 0 10px}
.niveau .bar i{display:block;height:100%;background:#fff;border-radius:99px}
.niveau .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.niveau .mini div{border-top:1px solid rgba(217,222,238,.35);padding-top:12px}
.niveau .mini b{display:block;font-weight:800;font-size:28px;letter-spacing:-.5px}
.niveau .mini span{font-size:13px;color:var(--isoloir-pale)}
.badges{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:10px}
.badge{border:1.5px solid var(--filet);border-radius:var(--r-carte);padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.badge.on{border:2px solid var(--encre)}
.badge .m{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:transparent;border:1.5px dashed var(--filet);color:var(--encre-douce)}
.badge.on .m{background:var(--or);border:0;color:#16192B}
.badge b{font-weight:700;font-size:15px;line-height:1.25}
.badge:not(.on) b{color:var(--encre-douce)}
.lien-c{display:flex;align-items:center;gap:14px;width:100%;padding:16px 0;border-top:1.5px solid var(--filet);min-height:64px}
.lien-c .t{flex:1;font-weight:700;font-size:16px}
.lien-c .s{display:block;font-weight:400;font-size:14px;color:var(--encre-douce)}
.mentions{font-size:13px;color:var(--encre-douce);line-height:1.55;max-width:60ch}

/* Auth */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100dvh;width:100%}
.auth-g{background:var(--isoloir-fond);color:#fff;padding:48px clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-g h1{font-weight:800;font-size:clamp(46px,6.4vw,88px);line-height:.98;letter-spacing:-.035em;text-wrap:balance}
.auth-g h1 em{font-style:italic;color:#fff;opacity:.85}
.auth-g .chapo{font-size:20px;font-weight:500;max-width:34ch;line-height:1.5;color:var(--isoloir-pale);margin-top:20px}
.auth-g .etiquette{color:var(--isoloir-pale)}
.auth-g .moutons-b{background:#F5F0E6;border-radius:var(--r-carte);padding:12px}
.auth-d{display:flex;align-items:center;justify-content:center;padding:48px clamp(20px,5vw,72px)}
.form{width:100%;max-width:440px;display:flex;flex-direction:column;gap:20px}
.onglets{display:flex;border-bottom:2px solid var(--encre)}
.onglet{padding:12px 4px;margin-right:24px;font-weight:700;font-size:16px;color:var(--encre-douce);border-bottom:4px solid transparent;margin-bottom:-2px;min-height:48px}
.onglet[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--isoloir)}
.champ{display:flex;flex-direction:column;gap:6px}
.champ label{font-weight:700;font-size:14px}
.inp{width:100%;min-height:52px;padding:12px 14px;border:1.5px solid var(--filet);border-radius:var(--r-rep);background:var(--surface);font-size:16px}
.inp:focus{outline:3px solid var(--urne);outline-offset:2px;border-color:var(--encre)}
.ou{display:flex;align-items:center;gap:12px;color:var(--encre-douce);font-size:14px;font-weight:600}
.ou::before,.ou::after{content:"";flex:1;height:1.5px;background:var(--filet)}
.deux{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.moutons{width:100%;height:auto;display:block;background:var(--fond-mascotte);border-radius:var(--r-carte);padding:var(--pad-mascotte)}
.vide{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.vide .moutons{max-width:360px}

/* Mention prototype */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;z-index:30;background:var(--encre);color:var(--papier);font:600 12.5px/1 var(--sans);padding:9px 14px;border-radius:999px;white-space:nowrap;opacity:.92;pointer-events:none}

/* Échelle boussole */
.echelle{display:flex;flex-direction:column;gap:10px}

@media (max-width:1000px){
  .grid2{grid-template-columns:1fr;gap:40px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .auth{grid-template-columns:1fr}
  .auth-g{padding-block:32px}
  .auth-g .moutons-b{display:none}
}
@media (max-width:860px){
  .side{display:none}
  .top{padding:12px 16px}
  .top .web{display:none}
  .top .mob{display:flex!important}
  .page{padding:28px 16px 40px}
  .entete{margin-bottom:28px}
  .bnav{display:flex;flex:none;background:var(--papier);border-top:2px solid var(--encre);padding:0 4px calc(8px + env(safe-area-inset-bottom))}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;font-size:12px;font-weight:600;color:var(--encre-douce);min-height:58px;border-top:4px solid transparent;margin-top:-2px}

function Agenda(){
  const F = ['Tout','Débat','Meeting','Interview','Autre'];
  const list = EVENTS.filter(e=>S.filter==='Tout'||e.cat===S.filter);
  const dated = list.filter(e=>e.off!==null), undated = list.filter(e=>e.off===null);
  const days = [...new Set(dated.map(e=>e.off))].sort((a,b)=>a-b);
  const evt = e => {
    const d = e.off!==null?dayOff(e.off):null;
    const box = e.off!==null ? `<div class="quand"><b class="num">${e.time}</b><small>${d.getDate()} ${MOIS[d.getMonth()]}</small></div>` : `<div class="quand"><b>${e.mois[0]}</b><small>${e.mois[1]}</small></div>`;
    const on = S.rem.has(e.id);
    return `<div class="evt">${box}<div><h3>${e.title}</h3>
      <div class="meta"><span class="pastille theme">${e.cat}</span>${e.rel?`<span class="pastille theme" style="border-style:dashed">${e.rel}</span>`:''}<span class="qui">${[e.who,e.city].filter(Boolean).join(' · ')}</span></div>
      ${e.desc?`<p class="desc">${e.desc}</p>`:''}
      ${e.live?`<button class="row" style="gap:8px;margin-top:10px;min-height:44px;font-weight:700;color:var(--isoloir)" data-act="go" data-v="debat"><span class="live"></span>En direct · ouvrir la session ${IC.chev(16)}</button>`:''}
      <p class="src">Source · <a href="#" onclick="return false">${e.src}</a></p></div>
      ${e.off!==null?`<button class="cloche" aria-pressed="${on}" aria-label="${on?'Annuler le rappel':'Me rappeler'} — ${e.title}" data-act="rem" data-v="${e.id}">${IC.cloche(18,on)}</button>`:'<span></span>'}</div>`;
  };
  return `<div class="rise">
   ${entete('Agenda','Interviews, débats<br><em>et meetings.</em>','Mis à jour chaque jour, avec la source de chaque évènement.')}
   <div class="page-agenda" style="max-width:820px">
    <div class="filtres" role="group" aria-label="Filtrer par type">${F.map(f=>`<button class="filtre" aria-pressed="${S.filter===f}" data-act="filtre" data-v="${f}">${f}</button>`).join('')}</div>
    ${list.length===0?`<div class="vide"><div class="moutons-wrap" style="width:100%;max-width:360px">${moutons()}</div><h3 style="font-weight:800;font-size:24px">Rien de prévu pour ce filtre.</h3><p class="muted">Revenez demain, l’agenda est actualisé chaque jour.</p></div>`:''}
    ${days.map(o=>`<section class="jour"><span class="etiquette">${jourLabel(o)}</span>${dated.filter(e=>e.off===o).map(evt).join('')}</section>`).join('')}
    ${undated.length?`<section class="jour"><span class="etiquette">Dates à préciser</span>${undated.map(evt).join('')}</section>`:''}
   </div></div>`;
}

function QuizRun(){
  const q = S.q, n = QUIZ.length;
  if(q.fin){
    return `<div class="page flow rise" style="padding:0"><div class="stk" style="gap:28px">
     <div class="bandeau" style="padding:32px"><span class="etiquette">Quiz terminé</span>
       <div class="num" style="font-weight:800;font-size:clamp(64px,14vw,104px);line-height:1;letter-spacing:-3px;margin:6px 0">${S.quizScore} / ${n}</div>
       <div><span class="pastille succes">+${S.quizScore*20} points</span></div>
       <p style="margin-top:10px">${S.quizScore===n?'Sans faute. Les institutions n’ont plus de secret pour vous.':'Chaque explication renvoie à sa source : relisez-les, elles tiennent en une phrase.'}</p></div>
     <div class="moutons-wrap">${moutons()}</div>
     <div class="stk" style="gap:12px"><button class="btn btn-p btn-b" data-act="go" data-v="quiz-tab">Voir le classement</button><button class="btn btn-t" style="align-self:center" data-act="go" data-v="accueil-tab">Retour à l’accueil</button></div>
    </div></div>`;
  }
  const d = QUIZ[q.i], ans = q.sel!==null;
  const ok = q.res.map((r,k)=>r?k:-1).filter(k=>k>=0), ko = q.res.map((r,k)=>r?-1:k).filter(k=>k>=0);
  return `<div class="rise"><div class="vedette">
    <div class="tete"><span class="etiquette">Question du jour · ${q.i+1} / ${n}</span><span class="pastille theme">${d.t}</span></div>
    ${prog(n,ok,ko,q.i)}
    <h3 style="font-size:clamp(22px,3.2vw,28px);line-height:1.25">${d.q}</h3>
    <div class="reponses col1">${d.r.map((r,k)=>{
      let c='';
      if(ans){ if(k===d.j) c='juste'; else if(k===q.sel) c='faux'; else c='estompe' }
      return `<button class="reponse ${c}" ${ans?'disabled':''} data-act="rep" data-v="${k}"><span class="l"><span class="k">${String.fromCharCode(65+k)}</span>${r}</span>${ans&&k===d.j?IC.coche():ans&&k===q.sel?svg('<path d="m6 6 12 12M18 6 6 18"/>',18):''}</button>`}).join('')}</div>
    ${ans?`<p class="explication ${q.res[q.res.length-1]?'':'ko'} rise"><strong>${q.res[q.res.length-1]?'Bonne réponse.':'Pas tout à fait.'}</strong> ${d.e}</p>`:''}
    <div class="pied-q"><span class="score">Score : <b class="num">${S.quizScore}</b> / ${n}</span>
      ${ans?`<button class="btn btn-p btn-sm" data-act="suivant">${q.i>=n-1?'Voir mon score':'Question suivante'}</button>`:''}</div>
  </div></div>`;
}

     <div class="gauche"><div class="web row"><span class="etiquette" style="color:var(--encre-douce)">${dateFr()}</span><span class="pastille">J-${jours()}</span></div>
      <a class="logo mob" href="#" style="color:var(--encre)">${LOGO(36)}<b>Mon petit vote</b><span class="pastille">2027</span></a></div>
     <div class="droite"><button class="icbtn" data-act="dark" aria-label="Changer de thème">${IC.lune(20)}</button>
      <button class="chip-pts num" data-act="tab" data-v="isoloir" aria-label="Mes points">${pts().toLocaleString('fr-FR')}<small>pts</small></button>
      <button class="disc avatar" data-act="tab" data-v="profil" aria-label="Mon profil">LM</button></div>
    </div>
    <div class="scroll" id="scroll"><div class="page ${flow?'flow':''}">
      ${S.route?`<button class="back" data-act="back">${IC.retour(18)}${S.route==='quiz'&&!S.q.fin?'Quitter':'Retour'}</button>`:''}
      ${body}</div></div>
    <nav class="bnav" aria-label="Navigation principale">${bnav}</nav>
   </div></div>
   <div class="proto">Prototype visuel · données d’exemple</div>`;
}
function go(r){ S.route=r; if(r==='quiz'&&!S.quizDone){S.q={i:0,sel:null,res:[],fin:false};S.quizScore=0} if(r==='quiz'&&S.quizDone){S.q.fin=true} if(r==='boussole'){S.aff={i:0,rep:[]};S.affDone=S.affDone} }
function toTop(){ const s=$('#scroll'); if(s) s.scrollTo({top:0}) }

document.addEventListener('click',e=>{
  const el = e.target.closest('[data-act]'); if(!el) return;
  const a = el.dataset.act, v = el.dataset.v;
  if(a==='entrer'&&el.tagName==='FORM') return;
  if(a==='mode'){S.mode=v}
  else if(a==='entrer'){S.authed=true}
  else if(a==='tab'){S.tab=v;S.route=null}
  else if(a==='go'){
    if(v==='agenda-tab'){S.tab='agenda';S.route=null}
    else if(v==='quiz-tab'){S.tab='quiz';S.route=null}
    else if(v==='isoloir-tab'){S.tab='isoloir';S.route=null}
    else if(v==='accueil-tab'){S.tab='accueil';S.route=null}
    else go(v);
    toTop()
  }
  else if(a==='back'){ if(S.route==='quiz'&&S.q.fin) S.tab='quiz'; S.route=null; toTop() }
  else if(a==='filtre'){S.filter=v}
  else if(a==='theme'){S.theme=v}
  else if(a==='rem'){const id=+v;S.rem.has(id)?S.rem.delete(id):S.rem.add(id)}
  else if(a==='voter'){S.vote=v;S.ptsBonus+=15}
  else if(a==='rep'){const k=+v,d=QUIZ[S.q.i];S.q.sel=k;const ok=k===d.j;S.q.res.push(ok);if(ok)S.quizScore++}
  else if(a==='suivant'){ if(S.q.i>=QUIZ.length-1){S.q.fin=true;S.quizDone=true;S.ptsBonus+=S.quizScore*20}else{S.q.i++;S.q.sel=null} toTop() }
  else if(a==='aff'){ S.aff.i++; if(S.aff.i>=AFF.length){S.affDone=true} }
  else if(a==='dark'){const r=document.documentElement;const dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=dark?'light':'dark'}
  else if(a==='logout'){S.authed=false;S.route=null;S.tab='accueil'}
  render();
});
document.addEventListener('submit',e=>{e.preventDefault();S.authed=true;render()});
render();
</script>
</body>
</html>
